<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Cairo; font-weight: 600; src: url("../assets/fonts/Cairo-600.ttf"); }
@font-face { font-family: Cairo; font-weight: 800; src: url("../assets/fonts/Cairo-800.ttf"); }
:root {
  --yellow: #F5C518; --green: #22B35E; --red: #E0353B; --blue: #2F7BEA; --white: #F2F2F2;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #0b0d12; font-family: Cairo, sans-serif; }
#stage { position: absolute; inset: 0; overflow: hidden; }

.bg { position: absolute; inset: 0; opacity: 0; }
.bg img { width: 100%; height: 100%; object-fit: cover; }
.bg.mood-dark  { background: radial-gradient(circle at 50% 45%, #2b303b 0%, #0c0e13 70%); }
.bg.mood-blue  { background: radial-gradient(circle at 50% 45%, #1f4a8c 0%, #0a1630 72%); }
.bg.mood-green { background: radial-gradient(circle at 50% 45%, #1f7048 0%, #06170e 72%); }
.bg.mood-red   { background: radial-gradient(circle at 50% 45%, #8a1f26 0%, #1c0507 72%); }
.bg.mood-gray  { background: radial-gradient(circle at 50% 45%, #74777e 0%, #2a2c31 75%); }

/* header */
#bar { position: absolute; top: 100px; left: 80px; right: 80px; height: 6px; background: rgba(255,255,255,.22); border-radius: 3px; overflow: hidden; }
#barFill { position: absolute; top: 0; bottom: 0; left: 0; width: 0; background: var(--yellow); }
#brand { position: absolute; top: 122px; width: 100%; text-align: center; color: #fff; font-weight: 800; font-size: 34px; letter-spacing: 1px; }
#brandLine { position: absolute; top: 178px; left: 504px; width: 72px; height: 6px; background: var(--yellow); border-radius: 3px; }

.scene { position: absolute; inset: 0; opacity: 0; }
.title { position: absolute; top: 215px; width: 100%; text-align: center; color: #fff; font-weight: 800; font-size: 84px; line-height: 1.3; direction: rtl; text-shadow: 0 4px 18px rgba(0,0,0,.45); }

.media { position: absolute; top: 470px; left: 0; width: 1080px; height: 720px; overflow: hidden; }
.media img { width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; }
.media.contain { left: 90px; width: 900px; height: 640px; top: 500px; background: #fff; border-radius: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.45); }
.media.contain img { object-fit: contain; padding: 24px; }

.badge { position: absolute; top: 560px; left: 340px; width: 400px; height: 400px; border-radius: 50%; border: 22px solid var(--yellow); display: flex; align-items: center; justify-content: center; color: var(--yellow); font-weight: 800; font-size: 130px; box-shadow: 0 0 80px rgba(245,197,24,.35); }

.pills { position: absolute; top: 1230px; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 26px; }
.media.contain ~ .pills { top: 1180px; }
.no-media .pills { top: 560px; gap: 40px; }
.pill { direction: rtl; padding: 10px 44px 16px; border-radius: 60px; font-weight: 800; font-size: 50px; color: #fff; opacity: 0; box-shadow: 0 10px 30px rgba(0,0,0,.35); white-space: nowrap; }
.no-media .pill { font-size: 62px; }
.pill.green { background: var(--green); } .pill.red { background: var(--red); } .pill.blue { background: var(--blue); }
.pill.yellow { background: var(--yellow); color: #1a1a1a; } .pill.white { background: var(--white); color: #1a1a1a; }

#sub { position: absolute; top: 1590px; left: 90px; right: 90px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
#sub span { direction: rtl; background: rgba(0,0,0,.78); color: #fff; font-weight: 600; font-size: 46px; line-height: 1.5; padding: 4px 24px 10px; border-radius: 14px; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const backOut = x => { x = clamp(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };

let R, els = [];
window.setup = (data) => {
  R = data;
  const st = document.getElementById("stage");
  const bgs = R.scenes.map(s => {
    const d = document.createElement("div");
    d.className = "bg mood-" + s.mood;
    if (s.bg_image) d.innerHTML = `<img src="${s.bg_image}">`;
    st.appendChild(d); return d;
  });
  st.insertAdjacentHTML("beforeend", `<div id="bar"><div id="barFill"></div></div><div id="brand">${R.brand}</div><div id="brandLine"></div>`);
  els = R.scenes.map((s, i) => {
    const d = document.createElement("div");
    d.className = "scene" + (s.image || s.badge ? "" : " no-media");
    let h = `<div class="title">${s.title}</div>`;
    if (s.image) h += `<div class="media ${s.fit === "contain" ? "contain" : ""}"><img src="${s.image}"></div>`;
    else if (s.badge) h += `<div class="badge">${s.badge}</div>`;
    h += `<div class="pills">${s.pills.map(p => `<div class="pill ${p.color}">${p.text}</div>`).join("")}</div>`;
    d.innerHTML = h; st.appendChild(d);
    return { root: d, bg: bgs[i], title: d.querySelector(".title"), img: d.querySelector(".media img"),
             badge: d.querySelector(".badge"), pills: [...d.querySelectorAll(".pill")] };
  });
  st.insertAdjacentHTML("beforeend", `<div id="sub"></div>`);
  return document.fonts.ready.then(() => Promise.all([...document.images].map(im => im.decode().catch(() => {}))));
};

let lastSub = null;
window.renderAt = (t) => {
  document.getElementById("barFill").style.width = (100 * clamp(t / R.total)) + "%";
  R.scenes.forEach((s, i) => {
    const e = els[i], lt = t - s.start;
    const fadeIn = i === 0 ? 1 : easeOut(lt / 0.3);
    const vis = lt >= -0.001 && t < s.end + 0.3 ? fadeIn : 0;
    e.root.style.opacity = vis; e.bg.style.opacity = vis;
    if (!vis) return;
    const same = i > 0 && R.scenes[i - 1].title === s.title;   // keep title still when it repeats
    const tp = same ? 1 : easeOut(lt / 0.45);
    e.title.style.transform = `translateY(${(1 - tp) * 40}px)`; e.title.style.opacity = tp;
    if (e.img) e.img.style.transform = `scale(${1.02 + 0.08 * clamp(lt / s.dur)})`;
    if (e.badge) { const b = backOut(lt / 0.6); e.badge.style.transform = `scale(${b}) rotate(${(1 - clamp(lt / 0.6)) * -90}deg)`; e.badge.style.opacity = clamp(lt / 0.3); }
    s.pills.forEach((p, j) => {
      const k = (t - p.at) / 0.35;
      e.pills[j].style.opacity = clamp(k * 1.6);
      e.pills[j].style.transform = `scale(${k <= 0 ? 0.6 : 0.6 + 0.4 * backOut(k)})`;
    });
  });
  const sub = R.subs.find(x => t >= x.start && t < x.end);
  const key = sub ? sub.text : "";
  if (key !== lastSub) {
    document.getElementById("sub").innerHTML = sub ? sub.lines.map(l => `<span>${l}</span>`).join("") : "";
    lastSub = key;
  }
};
</script>
</body>
</html>
